<h1 class="title">AI Gateway</h1>
<p class="login-box-msg">Entre com seu e-mail e senha.</p>

<p class="callout callout-info" *ngIf="infoMessage" role="status">
  {{ infoMessage }}
</p>
<p class="callout callout-error" *ngIf="errorMessage" role="alert">
  {{ errorMessage }}
</p>

<form [formGroup]="form" (ngSubmit)="submit()" class="sign-in-form">
  <mat-form-field appearance="outline" subscriptSizing="dynamic">
    <mat-label>E-mail</mat-label>
    <input
      matInput
      type="email"
      formControlName="email"
      autocomplete="username"
    />
  </mat-form-field>

  <mat-form-field appearance="outline" subscriptSizing="dynamic">
    <mat-label>Senha</mat-label>
    <input
      matInput
      [type]="passwordVisible ? 'text' : 'password'"
      formControlName="password"
      autocomplete="current-password"
    />
    <button
      mat-icon-button
      matSuffix
      type="button"
      (click)="passwordVisible = !passwordVisible"
      [attr.aria-label]="passwordVisible ? 'Ocultar senha' : 'Mostrar senha'"
    >
      <mat-icon>{{
        passwordVisible ? 'visibility_off' : 'visibility'
      }}</mat-icon>
    </button>
  </mat-form-field>

  <button
    mat-flat-button
    class="btn-primary-green"
    type="submit"
    [disabled]="form.invalid || submitting"
  >
    Entrar
  </button>
</form>
